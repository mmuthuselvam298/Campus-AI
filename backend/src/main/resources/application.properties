# SQLite Database & Storage Configuration
app.database.path=${DATABASE_PATH:./data/campus_lost_found.db}
app.upload.dir=${UPLOAD_DIRECTORY:./uploads}

# Server & Session
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=1d

# CORS
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# AI Integration (Gemini) - No hardcoded fallback
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

# Spring Mail & SMTP Configuration
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:lostandfound@campus.edu}

# Authentication & Access Control
app.auth.dev-otp-enabled=${AUTH_DEV_OTP_ENABLED:true}
app.auth.campus-domains=${CAMPUS_EMAIL_DOMAINS:}
app.auth.initial-admin-emails=${INITIAL_ADMIN_EMAILS:admin@campus.edu}

# File Upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
